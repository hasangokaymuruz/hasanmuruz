---
layout: default
---

<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-date">📅 {{ page.date | date: "%d %B %Y" }}</p>
        {% if page.categories %}
        <p class="post-categories">
            🏷️ 
            {% for category in page.categories %}
                <span class="category-tag">{{ category }}</span>
            {% endfor %}
        </p>
        {% endif %}
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <footer class="post-footer">
        <a href="{{ '/' | relative_url }}" class="btn">⬅️ Ana Sayfaya Dön</a>
    </footer>
</article>

<style>
.post-header {
    border-bottom: 3px solid #ff0000;
    padding-bottom: 20px;
    margin-bottom: 30px;
}

.post-categories {
    margin-top: 10px;
}

.category-tag {
    background: linear-gradient(45deg, #ff0000, #00ff00);
    padding: 5px 15px;
    border-radius: 15px;
    margin-right: 10px;
    font-size: 0.9em;
    display: inline-block;
}

.post-content {
    margin: 30px 0;
}

.post-footer {
    margin-top: 50px;
    padding-top: 30px;
    border-top: 2px solid #00ff00;
    text-align: center;
}
</style>
