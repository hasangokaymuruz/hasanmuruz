title: Hasan Gökay Muruz
description: Mekanik Tasarım Mühendisi · FEA · Simülasyon · Teknoloji
baseurl: "/hasanmuruz"
url: "https://hasangokaymuruz.github.io"

author:
  name: Hasan Gökay Muruz
  title: Ar-Ge Mekanik Tasarım Mühendisi
  company: Siemens Türkiye
  linkedin: https://linkedin.com/in/hasangokaymuruz
  github: https://github.com/hasangokaymuruz
  email: hasangokaymuruz@gmail.com

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Giscus Yorum Sistemi
giscus:
  repo: hasangokaymuruz/hasanmuruz
  repo_id: "R_kgDOS4qPmA"
  category: Ideas
  category_id: "DIC_kwDOS4qPmM4C_Cuh"
  mapping: pathname
  theme: dark

# Pagination
paginate: 8
paginate_path: "/blog/page:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
